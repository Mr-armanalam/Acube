<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Hi Dear user! I'm Acube a clone site of youtube"
    />
    <meta name="keywords" content="Acube, your-tube, youtube clone, you-tube-clone" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />

    <title>Acube</title>
  </head>
  <body>
    <script>
      // Pre-paint theme init (Porcelain light theme, §8.9.23): apply the
      // stored choice — or the OS preference when System — before first
      // paint, so there is no flash of the wrong theme. Mirrors
      // ThemeProvider (localStorage key "theme": "auto" | "light" |
      // "dark"; default dark). Runs before React mounts.
      (function () {
        try {
          var mode = localStorage.getItem("theme") || "auto";
          var light =
            mode === "light" ||
            (mode !== "dark" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.body.classList.add("white-theme");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute("content", light ? "#F5F5F2" : "#0c0b0a");
        } catch (e) {
          /* Storage/media unavailable — dark default. */
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
